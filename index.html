<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ToDoer</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script type="module" src="./js/todoHandlers.js"></script>
</head>

<body>
    <h1>ToDoer App</h1>
    <table class="todo-editor-table">
        <tr>
            <td>
                <div class="list-div">
                    <!-- The list of to-do items is displayed on the left side of the page -->
                    <select id="todo-list" size="8" aria-label="To-do items">
                    </select>
                </div>
            </td>
            <td>
                <form>
                    <!-- The Name field in the top of the form on the right side of the page -->
                    <div class="field-div">
                        <label for="todo-name">Name</label>
                        <input id="todo-name" name="name" type="text">
                    </div>
                    <!-- The Notes field in the middle of the form on the right side of the page -->
                    <div class="field-div">
                        <label for="todo-notes">Notes</label>
                        <textarea id="todo-notes" name="notes" rows="6"></textarea>
                    </div>
                    <!-- The New/Save and Delete buttons at the bottom of the form -->
                    <div class="actions-div">
                        <button id="todo-save" type="button" disabled>Save</button>
                        <button id="todo-delete" type="button">Delete</button>
                        <img id="wipe-image" src="./assets/wipe_icon.png" alt="wipe">
                    </div>
                </form>
            </td>
        </tr>
    </table>
</body>

</html>
